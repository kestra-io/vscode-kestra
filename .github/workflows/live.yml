name: Live Kestra

# Runs src/test/live.test.ts against a throwaway OSS instance per Kestra line in COMPATIBLE_KESTRA_VERSION.properties,
# since some routes differ between versions.
# develop is the next line: it runs every weekday as an early warning and never blocks a PR.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1-5"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  list-versions:
    uses: ./.github/workflows/list-versions.yml

  live:
    name: Kestra ${{ matrix.kestra }}
    needs: list-versions
    runs-on: ubuntu-latest
    continue-on-error: ${{ matrix.kestra == 'develop' }}
    strategy:
      fail-fast: false
      matrix:
        kestra: ${{ fromJSON(needs.list-versions.outputs.versions) }}
    # Throwaway credentials for the container started below, not a secret.
    env:
      KESTRA_TEST_URL: http://localhost:18080
      KESTRA_TEST_USERNAME: admin@kestra.io
      KESTRA_TEST_PASSWORD: Admin1234!
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Start Kestra ${{ matrix.kestra }}
        env:
          KESTRA_VERSION: ${{ matrix.kestra }}
        run: |
          docker run -d --name kestra-test -p 18080:8080 \
            -e KESTRA_CONFIGURATION="kestra:
            server:
              basic-auth:
                username: $KESTRA_TEST_USERNAME
                password: $KESTRA_TEST_PASSWORD" \
            "kestra/kestra:${KESTRA_VERSION}-slim" server local
          # 1.3 serves /configs without auth, 2.x answers 401: either means the server is up.
          for _ in $(seq 90); do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$KESTRA_TEST_URL/api/v1/configs" || true)
            if [ "$code" = 200 ] || [ "$code" = 401 ]; then exit 0; fi
            sleep 2
          done
          docker logs kestra-test | tail -50
          exit 1

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Run the live tests
        run: npm run test:live

      - name: Slack - Notify on failure
        if: always() && github.event_name != 'pull_request' && job.status == 'failure'
        uses: kestra-io/actions/composite/slack-status@main
        with:
          channel: 'C09FE0QCN2E'
          webhook-url: ${{ secrets.SLACK_WEBHOOK_URL }}
          users-map: ${{ vars.GITHUB_TO_SLACK_MAP }}
          suffix: Kestra ${{ matrix.kestra }}
